<!DOCTYPE html>
<html lang="ru">
	<head>
		<title>hextotext</title>
	
	<script type="text/javascript">
        function textToHex(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            let hex = '';
            for (let i = 0; i < data.length; i++) {
                hex += data[i].toString(16).padStart(2, '0');
            }
            return hex;
        }

        function hexToText(hex) {
            const decoder = new TextDecoder();
            const bytes = [];
            for (let i = 0; i < hex.length; i += 2) {
                bytes.push(parseInt(hex.substr(i, 2), 16));
            }
            return decoder.decode(new Uint8Array(bytes));
        }

        function convertToHex() {
            const inputText = document.getElementById('text').value;
            const hexText = textToHex(inputText);
            document.getElementById('result').value = hexText;
        }

        function convertToText() {
            const hexText = document.getElementById('text').value;
            const asciiText = hexToText(hexText);
            document.getElementById('result').value = asciiText;
        }    

        function allclear() {
            document.getElementById('text').value = '';
            document.getElementById('result').value = '';
        }
	</script>
	
	</head>

	<body>
		<table>
			<tr>
				<td>
					<h1>Text To Hex / Hex To Text</h1>
					<div>
						<div>
							<div><strong>Текст:</strong></div>
							<div>
								<textarea class="form-textarea" rows="7" cols="60" name="text" id="text"></textarea>
							</div>
						</div>
						<div>
							<div><strong>Формат: UTF8</strong></div>
						</div>
						<div>
							<input type="button" value="Кодировать" onclick="convertToHex()" />
							<input type="button" value="Декодировать" onclick="convertToText()" />
						</div>
						</br>
						<div>
							<div><strong>Результат:</strong></div>
							<div>
								<textarea class="form-textarea" rows="7" cols="60" name="result" id="result"></textarea>
							</div>
						</div>
						<div>
							<input type="button" value="Очистить" onclick="allclear()" />
						</div>
					</div>
				</td>
			</tr>
		</table>
	</body>
</html>
